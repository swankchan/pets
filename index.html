<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mochi — a cat simulator</title>
<style>
  :root {
    --panel: rgba(18, 18, 22, 0.62);
    --stroke: rgba(255, 255, 255, 0.10);
    --text: #f1eee8;
    --dim: #a9a49b;
    --accent: #f0a24b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0c0e; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }
  .panel {
    position: absolute; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #status { top: 14px; left: 14px; width: 260px; }
  #status h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: .3px; }
  #status .sub { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; }
  #thought { color: var(--accent); font-weight: 600; margin-bottom: 10px; font-size: 13px; }
  .need { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; margin: 5px 0; }
  .need span { color: var(--dim); font-size: 11px; text-transform: capitalize; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.10); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .25s linear, background .4s; }
  #settings { top: 14px; right: 14px; width: 205px; }
  #settings label { display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin: 7px 0; color: var(--dim); font-size: 11.5px; }
  select, input[type=range] { background: rgba(255,255,255,.08); color: var(--text);
    border: 1px solid var(--stroke); border-radius: 7px; padding: 3px 6px; font: inherit; font-size: 11.5px; }
  input[type=range] { padding: 0; width: 96px; }
  #dock { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 10px; }
  button {
    background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--stroke);
    padding: 9px 13px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 12.5px;
    transition: background .15s, transform .08s, border-color .15s;
  }
  button:hover { background: rgba(255,255,255,.15); }
  button:active { transform: translateY(1px); }
  button.on { background: rgba(240,162,75,.25); border-color: rgba(240,162,75,.6); color: #ffd7a5; }
  button b { display: block; font-size: 10px; color: var(--dim); font-weight: 400; }
  #hint { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.45); font-size: 11.5px; text-align: center; pointer-events: none; }
  #perf { bottom: 16px; right: 14px; color: var(--dim); font-size: 11px; padding: 8px 11px; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    justify-items: center; background: #0c0c0e; z-index: 20; transition: opacity .6s; }
  #loading .ring { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  #loading p { color: var(--dim); margin: 0; font-size: 12.5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>

<div id="status" class="panel">
  <h1 id="catname">Mochi</h1>
  <div class="sub"><span id="mood">content</span> · trust <span id="trust">45%</span></div>
  <div id="thought">waking up…</div>
  <div id="needs"></div>
</div>

<div id="settings" class="panel">
  <label>Quality
    <select id="quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high" selected>High</option>
      <option value="ultra">Ultra (RTX)</option>
    </select>
  </label>
  <label>Coat
    <select id="coat">
      <option value="tabby">Brown tabby</option>
      <option value="grey">Russian blue</option>
      <option value="ginger">Ginger</option>
      <option value="tuxedo">Tuxedo</option>
    </select>
  </label>
  <label>Life speed <input id="timescale" type="range" min="0.25" max="6" step="0.25" value="1" /></label>
  <label>Follow cam <input id="follow" type="checkbox" checked /></label>
  <label>Sound <input id="sound" type="checkbox" checked /></label>
</div>

<div id="dock" class="panel">
  <button id="btn-feed">Feed<b>F</b></button>
  <button id="btn-toy">Throw toy<b>T</b></button>
  <button id="btn-laser">Laser<b>L</b></button>
  <button id="btn-call">Call kitty<b>Space</b></button>
</div>

<div id="hint">drag to orbit · scroll to zoom · <b>click &amp; hold the cat to pet her</b></div>
<div id="perf" class="panel"><span id="fps">–</span> fps · <span id="tris">–</span></div>

<div id="loading"><div class="ring"></div><p id="loadmsg">sculpting the cat…</p></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
